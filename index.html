<script>
(() => {
  // ===== 1. КАСТОМИЗАЦИЯ ИЗ ГАЛЕРЕИ (СВИНКА + ФОН) =====
  window.customPigImage = null;
  window.customBgImage = null;

  const STORAGE_PIG = 'guinea_custom_pig_v1';
  const STORAGE_BG = 'guinea_custom_bg_v1';
  const STORAGE_WORLD = 'guinea_world_mode_v1';

  function compressImage(file, maxWidth, maxHeight, isSquare, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        if (isSquare) {
          const size = Math.min(img.width, img.height);
          const sx = (img.width - size) / 2;
          const sy = (img.height - size) / 2;
          canvas.width = 256;
          canvas.height = 256;

          ctx.beginPath();
          ctx.arc(128, 128, 128, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          ctx.drawImage(img, sx, sy, size, size, 0, 0, 256, 256);
          callback(canvas.toDataURL('image/png'));
        } else {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          if (h > maxHeight) {
            w = Math.round((w * maxHeight) / h);
            h = maxHeight;
          }
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function applyCustomAsset(type, dataUrl) {
    const isPig = type === 'pig';
    const card = document.getElementById(isPig ? 'pigCard' : 'bgCard');
    const preview = document.getElementById(isPig ? 'pigPreview' : 'bgPreview');

    if (!dataUrl) {
      if (card) card.classList.remove('has-custom');
      if (preview) preview.innerHTML = isPig ? '🐹' : '🌄';
      if (isPig) window.customPigImage = null;
      else window.customBgImage = null;
      return;
    }

    const img = new Image();
    img.onload = () => {
      if (isPig) window.customPigImage = img;
      else window.customBgImage = img;
    };
    img.src = dataUrl;

    if (card) card.classList.add('has-custom');
    if (preview) preview.innerHTML = `<img src="${dataUrl}" alt="preview">`;
  }

  const pigInput = document.getElementById('pigInput');
  const bgInput = document.getElementById('bgInput');
  const resetPigBtn = document.getElementById('resetPigBtn');
  const resetBgBtn = document.getElementById('resetBgBtn');

  if (pigInput) {
    pigInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 256, 256, true, (dataUrl) => {
        try { localStorage.setItem(STORAGE_PIG, dataUrl); } catch (err) {}
        applyCustomAsset('pig', dataUrl);
      });
    });
  }

  if (bgInput) {
    bgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 960, 540, false, (dataUrl) => {
        try { localStorage.setItem(STORAGE_BG, dataUrl); } catch (err) {}
        applyCustomAsset('bg', dataUrl);
      });
    });
  }

  if (resetPigBtn) {
    resetPigBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      localStorage.removeItem(STORAGE_PIG);
      if (pigInput) pigInput.value = '';
      applyCustomAsset('pig', null);
    });
  }

  if (resetBgBtn) {
    resetBgBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      localStorage.removeItem(STORAGE_BG);
      if (bgInput) bgInput.value = '';
      applyCustomAsset('bg', null);
    });
  }

  // ===== 2. МИР ЗЛОЙ БАБУШКИ И ПИРОЖКИ =====
  window.gameWorldMode = localStorage.getItem(STORAGE_WORLD) || 'classic';

  const pies = [];
  let pieSpawnTimer = 0.7;
  let grannyAnimTime = 0;

  function setWorldMode(mode) {
    window.gameWorldMode = mode === 'granny' ? 'granny' : 'classic';
    try { localStorage.setItem(STORAGE_WORLD, window.gameWorldMode); } catch (e) {}

    const classicBtn = document.getElementById('worldClassicBtn');
    const grannyBtn = document.getElementById('worldGrannyBtn');
    const desc = document.getElementById('worldDesc');

    if (window.gameWorldMode === 'granny') {
      if (grannyBtn) grannyBtn.classList.add('active-granny');
      if (classicBtn) classicBtn.classList.remove('active-classic');
      if (desc) desc.textContent = 'Уворачивайся от пирожков!';
    } else {
      if (classicBtn) classicBtn.classList.add('active-classic');
      if (grannyBtn) grannyBtn.classList.remove('active-granny');
      if (desc) desc.textContent = 'Обычный забег';
    }

    pies.length = 0;
    pieSpawnTimer = 0.6;
  }

  const worldClassicBtn = document.getElementById('worldClassicBtn');
  const worldGrannyBtn = document.getElementById('worldGrannyBtn');
  if (worldClassicBtn) worldClassicBtn.addEventListener('click', () => setWorldMode('classic'));
  if (worldGrannyBtn) worldGrannyBtn.addEventListener('click', () => setWorldMode('granny'));

  window.resetGrannyWorld = function () {
    pies.length = 0;
    pieSpawnTimer = 0.7;
  };

  function spawnPie(canvas, groundY) {
    const highThrow = Math.random() < 0.42;
    const startX = canvas.width + 24;
    const targetY = highThrow
      ? groundY - 78 - Math.random() * 28
      : groundY - 22 - Math.random() * 14;

    pies.push({
      x: startX,
      y: highThrow ? targetY - 35 : targetY,
      startY: highThrow ? targetY - 35 : targetY,
      radius: 15,
      vx: -(290 + Math.random() * 140),
      arcAmp: highThrow ? 18 : 6,
      arcFreq: 0.015 + Math.random() * 0.01,
      angle: 0,
      rotSpeed: -(4 + Math.random() * 4),
      passed: false
    });
  }

  function rectsOverlap(a, b) {
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  window.updateGrannyWorld = function (dt, canvas, playerBox, groundY, callbacks = {}) {
    if (window.gameWorldMode !== 'granny') return;

    grannyAnimTime += dt * 8;
    pieSpawnTimer -= dt;

    if (pieSpawnTimer <= 0) {
      spawnPie(canvas, groundY);
      pieSpawnTimer = 0.85 + Math.random() * 0.8;
    }

    const pad = 4;
    const safePlayer = {
      x: playerBox.x + pad,
      y: playerBox.y + pad,
      w: Math.max(8, playerBox.w - pad * 2),
      h: Math.max(8, playerBox.h - pad * 2)
    };

    for (let i = pies.length - 1; i >= 0; i--) {
      const p = pies[i];
      p.x += p.vx * dt;
      p.y = p.startY + Math.sin(p.x * p.arcFreq) * p.arcAmp;
      p.angle += p.rotSpeed * dt;

      const pieBox = {
        x: p.x - p.radius + 3,
        y: p.y - p.radius + 3,
        w: (p.radius - 3) * 2,
        h: (p.radius - 3) * 2
      };

      if (rectsOverlap(safePlayer, pieBox)) {
        pies.splice(i, 1);
        if (typeof callbacks.onHit === 'function') callbacks.onHit();
        continue;
      }

      if (!p.passed && p.x + p.radius < safePlayer.x) {
        p.passed = true;
        if (typeof callbacks.onDodged === 'function') callbacks.onDodged(10);
      }

      if (p.x < -50) {
        pies.splice(i, 1);
      }
    }
  };

  window.drawGrannyWorld = function (ctx, canvas, groundY) {
    if (window.gameWorldMode !== 'granny') return false;

    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#3b1d14');
    grad.addColorStop(0.65, '#6b321b');
    grad.addColorStop(1, '#2b140b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(251, 146, 60, 0.08)';
    ctx.beginPath();
    ctx.arc(canvas.width * 0.78, canvas.height * 0.28, 90, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#451a03';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(0, groundY, canvas.width, 3);

    const gx = canvas.width - 54;
    const gy = groundY - 58 + Math.sin(grannyAnimTime) * 3;

    ctx.save();
    ctx.translate(gx, gy);

    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(0, -18, 16, Math.PI, 0);
    ctx.lineTo(18, -4);
    ctx.lineTo(-18, -4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fed7aa';
    ctx.beginPath();
    ctx.arc(0, -6, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#450a0a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-8, -11);
    ctx.lineTo(-2, -8);
    ctx.moveTo(8, -11);
    ctx.lineTo(2, -8);
    ctx.stroke();

    ctx.fillStyle = '#1c1917';
    ctx.fillRect(-6, -6, 2.5, 2.5);
    ctx.fillRect(3.5, -6, 2.5, 2.5);
    ctx.beginPath();
    ctx.moveTo(-4, 0);
    ctx.lineTo(4, 0);
    ctx.stroke();

    ctx.fillStyle = '#991b1b';
    ctx.fillRect(-13, 6, 26, 26);
    ctx.fillStyle = '#fef3c7';
    ctx.fillRect(-9, 10, 18, 20);

    ctx.restore();

    for (const p of pies) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.radius + 2, p.radius - 2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(0, -1, p.radius - 2, p.radius - 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-7, -2);
      ctx.lineTo(-3, 2);
      ctx.moveTo(0, -3);
      ctx.lineTo(2, 2);
      ctx.moveTo(6, -2);
      ctx.lineTo(8, 2);
      ctx.stroke();

      ctx.restore();
    }

    return true;
  };

  window.addEventListener('DOMContentLoaded', () => {
    const savedPig = localStorage.getItem(STORAGE_PIG);
    const savedBg = localStorage.getItem(STORAGE_BG);
    if (savedPig) applyCustomAsset('pig', savedPig);
    if (savedBg) applyCustomAsset('bg', savedBg);
    setWorldMode(window.gameWorldMode);
  });
})();
</script>
