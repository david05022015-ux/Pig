function askSecretPass(title,desc,onSuccess){
  var wasPlay=(state==='play');
  if(wasPlay)paused=true;
  ov('<div class="box"><h2>'+title+'</h2><p>'+desc+'</p><input type="password" id="fpi" inputmode="numeric" maxlength="12" placeholder="••••"><div class="msg" id="fpm"></div><button id="fpok">Включить</button><button class="sec" id="fpno">Отмена</button></div>');
  var inp=$('fpi');if(inp)setTimeout(function(){inp.focus()},50);
  function closePass(ok){
    if($('ov'))$('ov').style.display='none';
    if(ok){passAuth=true;try{localStorage.setItem('gp_fly','1')}catch(e){}onSuccess()}
    if(wasPlay){paused=false;t0=performance.now();requestAnimationFrame(loop)}
    else{bg();drawPig();if(state==='ready')ready();else if(state==='shop')shop()}
  }
  if($('fpok'))$('fpok').onclick=function(){if(inp&&inp.value.trim()===SECRET_PASS)closePass(true);else if($('fpm')){$('fpm').textContent='Неверный пароль';if(inp){inp.value='';inp.focus();}}};
  if(inp)inp.onkeydown=function(e){if(e.key==='Enter'&&$('fpok'))$('fpok').click()};
  if($('fpno'))$('fpno').onclick=function(){closePass(false)};
}

function setRec(d){if(!d)return;bests={1:d.b1||0,2:d.b2||d.best||0,3:d.b3||0};gold=d.gold===true;if(d.pass)accPass=d.pass}
function hasAccess(d){
  if(!d)return false;
  if(d.owner===uid)return true;
  if(d.owners&&d.owners[uid])return true;
  if(d.pass&&accPass&&d.pass===accPass)return true;
  return false;
}

async function logoutAccount(){

async function auth(){
  if(tok&&Date.now()<exp-60000)return;
  var rt=null,j;try{rt=localStorage.getItem('gp_rt')}catch(e){}
  if(rt){
    var r=await fetch('https://securetoken.googleapis.com/v1/token?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
    j=await r.json();
    if(j.id_token){tok=j.id_token;uid=j.user_id;exp=Date.now()+j.expires_in*1000;try{localStorage.setItem('gp_rt',j.refresh_token)}catch(e){}return;}
  }
  var r2=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  j=await r2.json();
  if(!j.idToken)throw new Error('auth');
  tok=j.idToken;uid=j.localId;exp=Date.now()+j.expiresIn*1000;
  try{localStorage.setItem('gp_rt',j.refreshToken)}catch(e){}
}
function dbu(p,q){return CFG.databaseURL.replace(/\/$/,'')+'/'+p+'.json?auth='+tok+(q||'')}
async function fget(p,q){await auth();var r=await fetch(dbu(p,q));if(!r.ok)throw new Error('get');return r.json()}
async function fput(p,d){await auth();var r=await fetch(dbu(p),{method:'PUT',body:JSON.stringify(d)});if(!r.ok)throw new Error('put');return r.json()}
async function fdel(p){await auth();var r=await fetch(dbu(p),{method:'DELETE'});if(!r.ok)throw new Error('del')}
async function loadGr(){if(!online)return;try{GRALL=await fget('grants')||{}}catch(e){}}
function getLoc(){try{return JSON.parse(localStorage.getItem('gp_board')||'{}')}catch(e){return{}}}
function loadLocal(n){var r=getLoc()[n];if(r&&typeof r==='object')setRec(r);else if(typeof r==='number')setRec({b2:r});else setRec({})}
async function save(){
  if(!nick)return;
  if(online){
    try{
      var key=nick.toLowerCase();
      var cur=await fget('scores/'+key)||{};
      cur.nick=nick;cur.owner=cur.owner||uid;cur.b1=bests[1];cur.b2=bests[2];cur.b3=bests[3];cur.gold=gold;
      if(accPass)cur.pass=accPass;
      await fput('scores/'+key,cur);
    }catch(e){}
  }else{
    var b=getLoc();b[nick]={b1:bests[1],b2:bests[2],b3:bests[3],gold:gold};
    try{localStorage.setItem('gp_board',JSON.stringify(b))}catch(e){}
  }
  loadLb();
}
function render(list){
  var ol=$('lb');if(!ol)return;ol.innerHTML='';
  if(!list.length){ol.innerHTML='<li><span class="n">Пока пусто — стань первым!</span></li>';return;}
  list.forEach(function(x,i){
    var li=document.createElement('li');if(nick&&x.nick&&x.nick.toLowerCase()===nick.toLowerCase())li.className='me';
    var a=document.createElement('span');a.className='r';a.textContent=i+1;
    var b=document.createElement('span');b.className='n';b.textContent=x.nick;
    if(x.gold){var g=document.createElement('span');g.className='gd';g.textContent='★';b.appendChild(g)}
    if(x.vip){var v=document.createElement('span');v.className='vp';v.textContent='♛';b.appendChild(v)}
    var c=document.createElement('span');c.className='s';c.textContent=x.best;
    li.appendChild(a);li.appendChild(b);li.appendChild(c);ol.appendChild(li);
  });
}
async function loadLb(){
  var l=[],f='b'+lbTab;
  try{
    if(online){
      await loadGr();
      var d=await fget('scores','&orderBy="'+f+'"&limitToLast=10');
      l=Object.keys(d||{}).map(function(k){var x=d[k],g=GRALL[k]||{};return{nick:x.nick,best:x[f]||0,gold:x.gold===true,vip:g.vip===true}});
    }else{
      var b=getLoc();
      l=Object.keys(b).map(function(k){var x=b[k];if(typeof x!=='object')x={b2:x};return{nick:k,best:x[f]||0,gold:!!x.gold}});
    }
  }catch(e){}
  l=l.filter(function(x){return x.best>0}).sort(function(a,b){return b.best-a.best});
  render(l.slice(0,10));
  document.querySelectorAll('#tb button').forEach(function(b){b.className=(+b.dataset.t===lbTab)?'on':''});
}
document.querySelectorAll('#tb button').forEach(function(b){b.onclick=function(){lbTab=+b.dataset.t;loadLb()}});
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT')return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
document.addEventListener('pointerdown',function(e){if(state==='play'&&!(e.target&&e.target.closest&&e.target.closest('button,input')))jump()});

try{bg();drawPig()}catch(e){}
if(nick&&ok(nick))ready();else{nick=null;nickScreen()}

(async function(){
  try{
    if(CFG.apiKey&&CFG.databaseURL){try{await auth();online=true}catch(e){online=false}}
    if(online){try{isAdmin=(await fget('admins/'+uid))===true}catch(e){}}
    if($('ln'))$('ln').textContent=online?'Ник закрепляется за устройством или паролем: можно играть и с телефона, и с ПК.':'Таблица пока локальная (только на этом устройстве).';
    loadLb();
    if(online)setInterval(loadLb,15000);
    if(nick){
      if(online){
        try{
          var d=await fget('scores/'+nick.toLowerCase());
          if(hasAccess(d)){setRec(d);if(state==='ready')ready()}
          else{nick=null;nickScreen()}
        }catch(e){}
      }else{
        loadLocal(nick);if(state==='ready')ready();
      }
    }
    await loadGr();syncModesUI();stepCare();
    if(state==='ready')ready();
  }catch(e){}
})();
</script>
