function nickScreen(){state='nick';score=0;hud();bg();drawPig();
ov('<div class="box"><h2>Введи свой ник</h2><p>3–12 символов: латиница, цифры, _</p><input type="text" id="ni" maxlength="12" autocomplete="off" autocapitalize="off" placeholder="Например, Piggy_77"><div class="msg" id="em"></div><button id="nb">Играть</button></div>');
var i=$('ni');if(nick)i.value=nick;
$('nb').onclick=async function(){var n=i.value.trim(),m=$('em');m.textContent='';
if(!ok(n)){m.textContent='Нужно 3–12 символов: латиница, цифры или _';return}
if(online){try{var d=await fget('scores/'+n.toLowerCase());if(d){if(d.owner!==uid){m.textContent='Ник «'+n+'» уже занят другим игроком';return}setRec(d)}
else{await fput('scores/'+n.toLowerCase(),{nick:n,owner:uid,b1:0,b2:0,b3:0,gold:false});setRec({})}}
catch(e){m.textContent='Не удалось проверить ник, попробуй ещё раз';return}}else{loadLocal(n)}
nick=n;try{localStorage.setItem('gp_nick',n)}catch(e){}await loadGr();ready()}}
function ready(){state='ready';score=0;hud();bg();drawPig();
var h='<div class="box"><h2>Привет, <span id="hn"></span>!</h2><p>Выбери сложность:</p>';
[1,2,3].forEach(function(k){h+='<button class="dbtn'+(diff===k?' on':'')+'" data-d="'+k+'"><span>'+LV[k].n+'</span><small>рекорд '+bests[k]+'</small></button>'});
h+='<p>'+(gold?'Золотая свинка открыта!':'Гипер: набери 1500 очков и получи золотую свинку')+'</p><button id="go">Старт</button><div class="lr"><button class="sec" id="shp">Магазин</button>'+(isAdmin?'<button class="sec" id="adm">Админ</button>':'')+'<button class="sec" id="chg">Ник</button></div>';
if(online)h+='<button class="lnk" id="mid">Мой ID</button><div class="note" id="idl"></div>';
h+='</div>';ov(h);$('hn').textContent=nick;
document.querySelectorAll('.dbtn').forEach(function(b){b.onclick=function(){diff=+b.dataset.d;lbTab=diff;try{localStorage.setItem('gp_diff',diff)}catch(e){}loadLb();ready()}});
$('go').onclick=start;$('shp').onclick=shop;$('chg').onclick=function(){nick=null;nickScreen()};
if(isAdmin)$('adm').onclick=adminPanel;
if(online)$('mid').onclick=function(){$('idl').textContent=uid}}
function shop(){state='shop';var m=Math.max(bests[1],bests[2],bests[3]);
var h='<div class="box"><h2>Магазин свинок</h2><p>Твой лучший рекорд: '+m+'</p>';
Object.keys(SK).forEach(function(k){var o=owned(k);
h+='<div class="row"><canvas data-k="'+k+'" width="172" height="104"></canvas><div class="in"><b>'+SK[k].n+'</b><small>'+SK[k].d+'</small></div><button class="sbtn" data-k="'+k+'"'+(o?'':' disabled')+'>'+(o?(curSkin()===k?'Выбрана':'Выбрать'):'Закрыта')+'</button></div>'});
h+='<button class="sec" id="bk">Назад</button></div>';ov(h);
document.querySelectorAll('.row canvas').forEach(function(c){c.getContext('2d').drawImage(getSpr(c.dataset.k),0,0)});
document.querySelectorAll('.sbtn').forEach(function(b){b.onclick=function(){skin=b.dataset.k;try{localStorage.setItem('gp_skin',skin)}catch(e){}bg();drawPig();shop()}});
$('bk').onclick=function(){ready()}}
async function adminPanel(){state='admin';
var h='<div class="box"><h2>Админ-панель</h2><p>Ник игрока:</p><input type="text" id="an" maxlength="12" autocomplete="off" autocapitalize="off" placeholder="Ник"><div class="chk">';
['grey','tux','gold','royal','malysh'].forEach(function(k){h+='<label><input type="checkbox" data-s="'+k+'">'+SK[k].n+'</label>'});
h+='<label><input type="checkbox" id="avip">VIP-значок в таблице</label></div><div class="msg" id="am"></div><button class="sec" id="al">Загрузить</button><button id="as">Выдать / сохранить</button><button class="red" id="ad">Удалить ник из таблицы</button><button class="sec" id="bk">Назад</button></div>';
ov(h);
function key(){var n=$('an').value.trim();if(!ok(n)){$('am').textContent='Введи ник: 3–12 символов, латиница, цифры, _';return null}$('am').textContent='';return n.toLowerCase()}
$('al').onclick=async function(){var k=key();if(!k)return;try{var d=await fget('grants/'+k)||{};document.querySelectorAll('.chk input[data-s]').forEach(function(c){c.checked=!!(d.skins&&d.skins[c.dataset.s])});$('avip').checked=d.vip===true;$('am').textContent='Загружено'}catch(e){$('am').textContent='Ошибка загрузки'}};
$('as').onclick=async function(){var k=key();if(!k)return;var o={skins:{},vip:$('avip').checked},any=o.vip;
document.querySelectorAll('.chk input[data-s]').forEach(function(c){if(c.checked){o.skins[c.dataset.s]=true;any=true}});
try{await fput('grants/'+k,any?o:null);await loadGr();$('am').textContent='Сохранено'}catch(e){$('am').textContent='Не удалось сохранить: нет прав админа'}};
$('ad').onclick=async function(){var k=key();if(!k)return;if(!confirm('Удалить ник '+k+' из таблицы? Рекорды пропадут.'))return;try{await fdel('scores/'+k);loadLb();$('am').textContent='Ник удалён'}catch(e){$('am').textContent='Не удалось удалить'}};
$('bk').onclick=function(){ready()}}
async function auth(){if(tok&&Date.now()<exp-60000)return;var rt=null,j;try{rt=localStorage.getItem('gp_rt')}catch(e){}
if(rt){var r=await fetch('https://securetoken.googleapis.com/v1/token?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});j=await r.json();
if(j.id_token){tok=j.id_token;uid=j.user_id;exp=Date.now()+j.expires_in*1000;try{localStorage.setItem('gp_rt',j.refresh_token)}catch(e){}return}}
var r2=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});j=await r2.json();
if(!j.idToken)throw new Error('auth');tok=j.idToken;uid=j.localId;exp=Date.now()+j.expiresIn*1000;try{localStorage.setItem('gp_rt',j.refreshToken)}catch(e){}}
function dbu(p,q){return CFG.databaseURL.replace(/\/$/,'')+'/'+p+'.json?auth='+tok+(q||'')}
async function fget(p,q){await auth();var r=await fetch(dbu(p,q));if(!r.ok)throw new Error('get');return r.json()}
async function fput(p,d){await auth();var r=await fetch(dbu(p),{method:'PUT',body:JSON.stringify(d)});if(!r.ok)throw new Error('put');return r.json()}
async function fdel(p){await auth();var r=await fetch(dbu(p),{method:'DELETE'});if(!r.ok)throw new Error('del')}
async function loadGr(){if(!online)return;try{GRALL=await fget('grants')||{}}catch(e){}}
function getLoc(){try{return JSON.parse(localStorage.getItem('gp_board')||'{}')}catch(e){return{}}}
function loadLocal(n){var r=getLoc()[n];if(r&&typeof r==='object')setRec(r);else if(typeof r==='number')setRec({b2:r});else setRec({})}
async function save(){if(!nick)return;
if(online){try{await fput('scores/'+nick.toLowerCase(),{nick:nick,owner:uid,b1:bests[1],b2:bests[2],b3:bests[3],gold:gold})}catch(e){}}
else{var b=getLoc();b[nick]={b1:bests[1],b2:bests[2],b3:bests[3],gold:gold};try{localStorage.setItem('gp_board',JSON.stringify(b))}catch(e){}}loadLb()}
function render(list){var ol=$('lb');ol.innerHTML='';
if(!list.length){ol.innerHTML='<li><span class="n">Пока пусто — стань первым!</span></li>';return}
list.forEach(function(x,i){var li=document.createElement('li');if(nick&&x.nick&&x.nick.toLowerCase()===nick.toLowerCase())li.className='me';
var a=document.createElement('span');a.className='r';a.textContent=i+1;var b=document.createElement('span');b.className='n';b.textContent=x.nick;
if(x.gold){var g=document.createElement('span');g.className='gd';g.textContent='★';b.appendChild(g)}
if(x.vip){var v=document.createElement('span');v.className='vp';v.textContent='♛';b.appendChild(v)}
var c=document.createElement('span');c.className='s';c.textContent=x.best;
li.appendChild(a);li.appendChild(b);li.appendChild(c);ol.appendChild(li)})}
async function loadLb(){var l=[],f='b'+lbTab;
try{if(online){await loadGr();var d=await fget('scores','&orderBy="'+f+'"&limitToLast=10');l=Object.keys(d||{}).map(function(k){var x=d[k],g=GRALL[k]||{};return{nick:x.nick,best:x[f]||0,gold:x.gold===true,vip:g.vip===true}})}
else{var b=getLoc();l=Object.keys(b).map(function(k){var x=b[k];if(typeof x!=='object')x={b2:x};return{nick:k,best:x[f]||0,gold:!!x.gold}})}}catch(e){}
l=l.filter(function(x){return x.best>0}).sort(function(a,b){return b.best-a.best});render(l.slice(0,10));
document.querySelectorAll('#tb button').forEach(function(b){b.className=(+b.dataset.t===lbTab)?'on':''})}
document.querySelectorAll('#tb button').forEach(function(b){b.onclick=function(){lbTab=+b.dataset.t;loadLb()}});
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
document.addEventListener('pointerdown',function(e){if(state==='play'&&!e.target.closest('button,input'))jump()});
bg();drawPig();
(async function(){
if(CFG.apiKey&&CFG.databaseURL){try{await auth();online=true}catch(e){online=false}}
if(online){try{isAdmin=(await fget('admins/'+uid))===true}catch(e){}}
$('ln').textContent=online?'Ник закрепляется за этим устройством: чужой ник занять нельзя.':'Таблица пока локальная (только на этом устройстве). Подключи Firebase по инструкции в README, и она станет общей.';
loadLb();if(online)setInterval(loadLb,15000);
if(nick){if(online){try{var d=await fget('scores/'+nick.toLowerCase());if(d&&d.owner===uid)setRec(d);else nick=null}catch(e){}}else loadLocal(nick)}
await loadGr();
if(nick&&ok(nick))ready();else{nick=null;nickScreen()}
})();
</script>
</body>
</html>
